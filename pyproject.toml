[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "digit-recognizer"
version = "0.1.0"
description = "Kaggle Digit Recognizer: MLP and CNN handwritten digit classification with PyTorch"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["torch", "torchvision", "numpy", "pandas", "matplotlib", "scikit-learn"]

[tool.setuptools.packages.find]
where = ["src"]
